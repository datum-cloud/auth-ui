# pnpm settings for this repo. It is a single package, not a workspace: there
# is no `packages:` list.

# Don't install a version until it has been public for one day (in minutes).
# pnpm defaults to this; writing it out lets the policy check see it.
minimumReleaseAge: 1440

# Our own packages are published and consumed across repos on the same day, so
# the one-day release delay must not hold them back.
minimumReleaseAgeExclude:
  - '@datum-cloud/*'

# Reject a version published with weaker provenance than the versions before
# it, such as a release pushed with a stolen token.
trustPolicy: no-downgrade

# Dependencies whose install scripts may run. Anything not listed is skipped.
# Only what a local install needs: lefthook installs the git hooks, cypress
# fetches its binary, esbuild checks its platform binary. CI and the image
# install with --ignore-scripts and fetch Cypress themselves.
allowBuilds:
  cypress: true
  esbuild: true
  lefthook: true

# Versions that overrides must agree with. package.json takes them with
# `catalog:` so each is written once.
catalog:
  '@bufbuild/protobuf': 2.17.0
  '@hono/node-server': ^2.1.3
  cypress: ^16.1.1
  typescript: ^6.0.3

# Security and compatibility overrides, moved from package.json `overrides`.
# The advisory each one fixes is listed in the supply-chain job in
# .github/workflows/ci.yml.
overrides:
  axios: ^1.21.0
  postcss: ^8.5.32
  nanoid: ^3.3.20
  undici: ^8.12.4
  form-data: ^4.0.6
  dompurify: ^3.4.17
  esbuild: ^0.28.2
  # react-router-hono-server pins 2.1.5; keep one copy at the app's version.
  '@hono/node-server': 'catalog:'
  '@bufbuild/protobuf': 'catalog:'
  qs: ^6.17.1
  joi: ^18.3.2
  source-map-js: ^1.2.2
  tinypool: ^2.2.0
  follow-redirects: ^1.16.2
  systeminformation: ^5.33.19
  # cypress-axe's peer range stops at Cypress 15; it runs on the app's Cypress.
  'cypress-axe>cypress': 'catalog:'
  # madge runs on the app's TypeScript, while dependency-tree keeps 5.9.3, as
  # it did under npm.
  'madge>typescript': 'catalog:'
  'dependency-tree>typescript': 5.9.3
  minimatch: 11.0.4
  glob: 14.0.3
