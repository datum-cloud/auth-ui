# Skeleton real-Zitadel harness for the acceptance suite (Phase 1 = TODO stub).
# Brings up Zitadel + Postgres; a follow-up task seeds a service user + an OIDC app.
services:
  db:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    environment: { POSTGRES_USER: zitadel, POSTGRES_PASSWORD: zitadel, POSTGRES_DB: zitadel }
  zitadel:
    image: ghcr.io/zitadel/zitadel:latest@sha256:9ea0e9ecfdc43115da871242e40a0320f2ece864c7cd8b5d41a863a7f4902499
    command: 'start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled'
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: db
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_EXTERNALSECURE: 'false'
    depends_on: [db]
    ports: ['8080:8080']
