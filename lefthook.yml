pre-commit:
  parallel: true
  commands:
    eslint:
      glob: '*.{js,jsx,ts,tsx}'
      exclude: '**/locales/**'
      run: bunx eslint --cache --cache-location node_modules/.cache/eslint/ {staged_files} --fix
      auto_add: true
    prettier:
      glob: '*.{js,jsx,ts,tsx,json}'
      exclude: '**/locales/**'
      run: bunx prettier --write {staged_files}
      auto_add: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: bunx tsc --noEmit
      stage_fixed: false
    i18n:
      glob: 'app/**/*.{ts,tsx}'
      env:
        CI: '1'
      run: bunx lingui extract --clean && bunx lingui compile --typescript && git add app/modules/i18n/locales/
      auto_add: true
    unit:
      # Runs the full vitest suite whenever any TS/TSX is staged so a broken test
      # (e.g. an assertion left stale by a component change) can't be committed.
      glob: '*.{ts,tsx}'
      run: bun run test:unit
      stage_fixed: false
