name: CI

on:
  pull_request: {}
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  # Publishing a GitHub release ships the artifacts production tracks: the
  # shared publish workflows tag by semver from the release ref, so a
  # release of v1.0.0 produces auth-ui:v1.0.0 and auth-ui-kustomize:v1.0.0.
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CYPRESS_CACHE_FOLDER: ~/.cache/Cypress

# Each job is self-sufficient: setup-node restores the persistent npm cache
# (~/.npm, which survives across runs) and each job runs its own
# `npm ci --ignore-scripts`. We deliberately do NOT share node_modules
# across jobs — a cache saved by the `install` job is not reliably visible to
# needs-dependent jobs within the SAME run (GitHub Actions same-run cross-job
# cache propagation gap), which previously left every downstream job with no
# deps. With a warm store the per-job install is a few seconds; on a cold miss
# it still produces a correct node_modules (just slower). The `install` job
# warms the cache once before the fan-out.

jobs:
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts

  lint:
    name: Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run lint:ci

  typecheck:
    name: Type Check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm run typecheck:cypress

  unit-tests:
    name: Unit Tests (component)
    needs: install
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx cypress install
      - run: CYPRESS=true npx cypress run --component
        env:
          SPLIT: ${{ strategy.job-total }}
          SPLIT_INDEX: ${{ strategy.job-index }}
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: component-artifacts-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  i18n-check:
    name: i18n Catalogs Fresh
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      # Catches commits made with --no-verify that bypass the lefthook i18n hook.
      - run: npm run i18n:extract && npm run i18n:compile
        env:
          CI: '1'
      - run: git diff --exit-code -- app/modules/i18n/locales

  supply-chain:
    name: Supply Chain (audit + SBOM)
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - name: Dependency audit (blocking)
        # All known transitive vulns are REMEDIATED via package.json `overrides` (each
        # parent's declared range accepts the patched version):
        #   undici          ^8.11.2   jsdom accepts ^8.9.0; @actions/http-client declares ^6.23.0
        #                             but is dev-only (cypress-split), verified on 8.x   fixes 10 undici advisories (2 high)
        #   form-data       ^4.0.6    cypress/axios accept ^4.0.x    fixes GHSA-hmw2-7cc7-3qxx (high)
        #   dompurify       ^3.4.16   isomorphic-dompurify accepts ^3.4.12   fixes GHSA-p98j-92pf-mc4p
        #   axios           ^1.20.0   wait-on accepts ^1.18.1   fixes 12 axios advisories (7 high)
        #   esbuild         ^0.28.1   vite accepts ^0.28; build + i18n extract verified   fixes GHSA-g7r4-m6w7-qqqr / GHSA-gv7w-rqvm-qjhr
        #   postcss         ^8.5.25   vite/madge/precinct accept ^8.x   fixes GHSA-fxqj-rqcc-2cmp
        #   joi             ^18.2.9   wait-on accepts ^18.x   fixes GHSA-wr44-6hxh-3jwq
        #   source-map-js   ^1.2.2    postcss/@tailwindcss/node/css-tree/@vue/compiler-core accept ^1.2.1   fixes GHSA-68fv-2mgg-jv7q (high)
        #   tinypool        ^2.2.0    @lingui/cli accepts ^2.1.0   fixes GHSA-5gmw-xhrv-c9v3 / GHSA-85c8-ppgw-ccpr (critical)
        #   follow-redirects ^1.16.1  axios accepts ^1.16.0   fixes GHSA-q3jh-wrc6-jgq8 / GHSA-8r9p-f939-6h3c (high)
        # brace-expansion 2.1.7 / 5.0.12 and js-yaml 5.4.2 came from scoped in-range updates,
        # NO override: js-yaml via `bun update js-yaml` (GHSA-r3ph-w7gj-g6xm). bun 1.3.14's
        # `bun update` did not reach nested copies, so the brace-expansion lock entries
        # were bumped in place with the registry integrity (hoisted 2.1.4 -> 2.1.7 under
        # minimatch@9's ^2.0.2; nested 5.0.9 -> 5.0.12 under minimatch@10's ^5.0.5), fixing
        # GHSA-qhr7-859c-m2p7 / GHSA-6j4f-fj2g-mc7p / GHSA-q2hr-2g5m-vwhr.
        # One advisory is TEMPORARILY ignored. It has no patched release, so no override can fix it:
        #   GHSA-vfj7-8cjw-p6xm  braces <=3.0.3 stack-exhaustion DoS from deeply nested patterns.
        #                        No fixed version is published (3.0.3 is the latest). It reaches the
        #                        tree only through dev tooling: micromatch under @lingui/cli and
        #                        under fast-glob via cypress-split. The production image prunes dev
        #                        dependencies, so it never ships. Drop this ignore once braces publishes a fix.
        # The two former exemptions are both genuinely fixed, not suppressed:
        #   GHSA-mh99-v99m-4gvg / GHSA-rgw5-rvv9-x895 (brace-expansion) — fixed without
        #     an override; each consumer nests its own minimatch on brace-expansion 5.x
        #     and the hoisted copy stays on 2.x.
        #     Do NOT add a brace-expansion override to "help" here: the majors are not
        #     interchangeable (v2 is a CJS default export, v4+ adds the named `expand`
        #     that current minimatch imports), so pinning one range across all parents
        #     breaks eslint and find-cypress-specs with
        #     "(0 , brace_expansion_1.expand) is not a function".
        #   GHSA-qwww-vcr4-c8h2 (react-router RSC CSRF) — fixed by the v8.3.0 upgrade.
        # If a NEW transitive advisory appears with no override-compatible fix, add its
        # GHSA id to the scripts/npm-audit.sh arguments here as a temporary measure and open a remediation follow-up.
        run: scripts/npm-audit.sh GHSA-vfj7-8cjw-p6xm
      - name: Generate SBOM (CycloneDX)
        run: npx --yes @cyclonedx/cdxgen@11.10.0 -t js -o sbom.cdx.json --spec-version 1.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  build:
    name: Build
    needs: [lint, typecheck, unit-tests, e2e, i18n-check, supply-chain]
    runs-on: ubuntu-latest
    if: ${{ !failure() && !cancelled() }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run size
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: build
          key: build-${{ github.sha }}

  e2e:
    name: E2E (fast, fake provider)
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The dev server validates env at boot; the fake provider only requires a
    # SESSION_SECRET (>= 32 chars). This is a throwaway CI value for the in-memory
    # fake auth provider — NOT a real secret.
    env:
      SESSION_SECRET: ci-e2e-fake-provider-dummy-session-secret
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx cypress install
      - run: npm run test:e2e:fast
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            cypress/videos
            cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  status-check:
    name: Final Status Check
    needs: [install, lint, typecheck, unit-tests, i18n-check, supply-chain, build, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check Workflow Status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "❌ One or more jobs failed"
            exit 1
          elif [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "⚠️ One or more jobs were cancelled"
            exit 1
          else
            echo "✅ All jobs passed"
          fi

  # Release publishes are production artifacts, so they must pass through the
  # `production` GitHub environment and its protection rules (the legacy
  # workflow did this inline). A job that calls a reusable workflow cannot
  # declare `environment:`, so this no-op job carries it and the publish jobs
  # depend on it. On push events it is skipped; the publish jobs' status-check
  # conditions (!failure()/!cancelled()) let them run regardless.
  release-gate:
    name: Production Release Gate
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Approve production publish
        run: echo "Release ${{ github.ref_name }} cleared for production publish"

  publish-container-image:
    name: Publish Container Image
    needs: [status-check, release-gate]
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@b3179aa08358c49d3cd45aa3b7567dd9a0bef651 # v1.22.0
    with:
      image-name: auth-ui
    # NOTE: `secrets: inherit` is required because the upstream workflow
    # references `secrets.SENTRY_AUTH_TOKEN` without declaring it under
    # `workflow_call.secrets`. Once upstream declares it, switch to an
    # explicit `secrets:` block passing only SENTRY_AUTH_TOKEN.
    secrets: inherit

  publish-kustomize-bundle:
    name: Publish Kustomize Bundle
    needs: [publish-container-image]
    if: ${{ github.event_name != 'pull_request' && !failure() && !cancelled() }}
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@b3179aa08358c49d3cd45aa3b7567dd9a0bef651 # v1.22.0
    with:
      bundle-name: ghcr.io/datum-cloud/auth-ui-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/datum-cloud/auth-ui

  # After a merge to main, wait for staging to serve this build, then sign in with the staging
  # account's passkey. Not part of status-check: it runs after publish and reports on the merged
  # commit. Account setup: acceptance/PASSKEY-TESTING.md.
  staging-passkey-check:
    name: Staging passkey check
    needs: [publish-container-image, publish-kustomize-bundle]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STAGING_ORIGIN: https://auth.staging.env.datum.net
    steps:
      - name: Check secrets
        id: secrets
        env:
          STAGING_PASSKEY_LOGIN_NAME: ${{ secrets.STAGING_PASSKEY_LOGIN_NAME }}
          STAGING_PASSKEY_CREDENTIAL_ID: ${{ secrets.STAGING_PASSKEY_CREDENTIAL_ID }}
          STAGING_PASSKEY_PRIVATE_KEY: ${{ secrets.STAGING_PASSKEY_PRIVATE_KEY }}
          STAGING_PASSKEY_USER_HANDLE: ${{ secrets.STAGING_PASSKEY_USER_HANDLE }}
        run: |
          missing=()
          for name in STAGING_PASSKEY_LOGIN_NAME STAGING_PASSKEY_CREDENTIAL_ID \
            STAGING_PASSKEY_PRIVATE_KEY STAGING_PASSKEY_USER_HANDLE; do
            [[ -z "${!name}" ]] && missing+=("$name")
          done
          if [[ ${#missing[@]} -eq 4 ]]; then
            echo "::notice::Staging passkey secrets not set; skipping"
            echo "present=false" >> "$GITHUB_OUTPUT"
          elif [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::Staging passkey secrets incomplete: ${missing[*]}"
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - if: steps.secrets.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version-file: .nvmrc, cache: npm }
      - if: steps.secrets.outputs.present == 'true'
        run: npm ci --ignore-scripts
      - if: steps.secrets.outputs.present == 'true'
        run: npx cypress install
      - name: Wait for this build on staging
        if: steps.secrets.outputs.present == 'true'
        run: scripts/wait-for-staging-version.sh "$STAGING_ORIGIN" "$BUILD_VERSION"
        env:
          BUILD_VERSION: ${{ needs.publish-container-image.outputs.build-version }}
      - name: Passkey sign-in
        id: attempt1
        env:
          CYPRESS_STAGING_PASSKEY_LOGIN_NAME: ${{ secrets.STAGING_PASSKEY_LOGIN_NAME }}
          CYPRESS_STAGING_PASSKEY_CREDENTIAL_ID: ${{ secrets.STAGING_PASSKEY_CREDENTIAL_ID }}
          CYPRESS_STAGING_PASSKEY_PRIVATE_KEY: ${{ secrets.STAGING_PASSKEY_PRIVATE_KEY }}
          CYPRESS_STAGING_PASSKEY_USER_HANDLE: ${{ secrets.STAGING_PASSKEY_USER_HANDLE }}
        if: steps.secrets.outputs.present == 'true'
        continue-on-error: true
        run: >-
          npx --no-install cypress run --browser chrome
          --config "baseUrl=${STAGING_ORIGIN},video=false"
          --env STAGING_PASSKEY=1
          --spec acceptance/staging-passkey.acceptance.cy.ts
      - name: Passkey sign-in (retry)
        id: attempt2
        env:
          CYPRESS_STAGING_PASSKEY_LOGIN_NAME: ${{ secrets.STAGING_PASSKEY_LOGIN_NAME }}
          CYPRESS_STAGING_PASSKEY_CREDENTIAL_ID: ${{ secrets.STAGING_PASSKEY_CREDENTIAL_ID }}
          CYPRESS_STAGING_PASSKEY_PRIVATE_KEY: ${{ secrets.STAGING_PASSKEY_PRIVATE_KEY }}
          CYPRESS_STAGING_PASSKEY_USER_HANDLE: ${{ secrets.STAGING_PASSKEY_USER_HANDLE }}
        if: steps.secrets.outputs.present == 'true' && steps.attempt1.outcome == 'failure'
        continue-on-error: true
        run: >-
          npx --no-install cypress run --browser chrome
          --config "baseUrl=${STAGING_ORIGIN},video=false"
          --env STAGING_PASSKEY=1
          --spec acceptance/staging-passkey.acceptance.cy.ts
      - name: Report result
        if: steps.secrets.outputs.present == 'true'
        env:
          FIRST: ${{ steps.attempt1.outcome }}
          RETRY: ${{ steps.attempt2.outcome }}
        run: |
          if [[ "$FIRST" == "success" ]]; then
            echo "Staging passkey sign-in passed"
          elif [[ "$RETRY" == "success" ]]; then
            echo "::warning::Staging passkey check passed on retry"
          else
            echo "::error::Staging passkey sign-in failed twice"
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-passkey-artifacts-${{ github.run_id }}
          path: cypress/screenshots
          retention-days: 7
          if-no-files-found: warn

  pr-comment:
    name: PR Test Summary
    needs: [status-check]
    runs-on: ubuntu-latest
    # Run after the final gate, and even when it fails, so the summary still posts.
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Build test summary
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const runId = context.runId;
            const fs = require('fs');
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${runId}`;
            const { data: jobs } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            const testJobs = jobs.jobs.filter(j =>
              j.name.startsWith('Unit Tests') || j.name.startsWith('E2E')
            );
            const statusEmoji = (c) => {
              if (!c || c === 'skipped') return '⏭️';
              if (c === 'success') return '✅';
              if (c === 'failure') return '❌';
              if (c === 'cancelled') return '🚫';
              return '❓';
            };
            let table = '| Job | Status |\n|-----|--------|\n';
            for (const job of testJobs.sort((a, b) => a.name.localeCompare(b.name))) {
              table += `| ${job.name} | ${statusEmoji(job.conclusion)} ${job.conclusion || 'pending'} |\n`;
            }
            let body = `## 🧪 Test Summary\n\n${table}\n\n[View workflow run](${runUrl})`;
            fs.writeFileSync('pr-summary.md', body);
      - uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: pr-summary.md
          edit-mode: replace
