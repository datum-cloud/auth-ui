name: CI
on:
  pull_request: {}
  push: { branches: [refactor/auth-ui-rebuild, main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - name: Dependency audit (blocking)
        # Blocks on ANY advisory except the three explicitly accepted ones below — all
        # DEV-GRAPH ONLY (verified via `bun why`: tmp ← @lhci/cli + cypress; uuid ← @lhci/cli),
        # never shipped in the production image (Dockerfile installs --production).
        # Remove an --ignore as soon as the upstream tooling releases a clean tree.
        run: >-
          bun audit
          --ignore=GHSA-ph9p-34f9-6g65
          --ignore=GHSA-52f5-9888-hmc6
          --ignore=GHSA-w5hq-g745-h8pq
      - run: bun run lint:ci
      - run: bun run typecheck
      - run: bun run i18n:compile
      - run: bun run test:unit
      - run: bunx cypress install
      - run: bun run test:e2e:fast
      - run: bun run build
      - run: bun run size
      # CycloneDX SBOM as a CI artifact (spec §9 supply-chain policy). Image-level
      # provenance/attestation rides the upstream datum-cloud publish-docker workflow
      # (attestations: write); this artifact records the full dependency bill of materials.
      - name: Generate SBOM (CycloneDX)
        run: bunx @cyclonedx/cdxgen@11.10.0 -t js -o sbom.cdx.json --spec-version 1.5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90

  # ─── Publish (push only, after verify) ──────────────────────
  publish-container-image:
    name: Publish Container Image
    needs: [verify]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
    uses: datum-cloud/actions/.github/workflows/publish-docker.yaml@545f34cd6f35e9688c9a04a7e890281bcdbaefd2 # v1.14.0
    with:
      image-name: auth-ui
    # NOTE: `secrets: inherit` is required because the upstream workflow
    # references `secrets.SENTRY_AUTH_TOKEN` without declaring it under
    # `workflow_call.secrets`. Once upstream declares it, switch to an
    # explicit `secrets:` block passing only SENTRY_AUTH_TOKEN.
    secrets: inherit

  publish-kustomize-bundle:
    name: Publish Kustomize Bundle
    needs: [publish-container-image]
    if: github.event_name == 'push'
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@545f34cd6f35e9688c9a04a7e890281bcdbaefd2 # v1.14.0
    with:
      bundle-name: ghcr.io/datum-cloud/auth-ui-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/datum-cloud/auth-ui
    # No explicit secrets block: upstream only uses GITHUB_TOKEN, which is
    # automatically available to reusable workflows.
