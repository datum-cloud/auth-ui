name: Lighthouse CI
# RE-ARMED at the Phase 1 boundary (2026-06-11): all Phase 1 screens are in the
# lighthouserc URL list and pass the LOCKED thresholds locally (perf ≥0.9, a11y =1.0,
# LCP ≤2500, CLS ≤0.1 — 18 runs, zero assertion failures). DO NOT weaken the thresholds;
# new screens must be added to lighthouserc.json as they land (INDEX §C).
on:
  workflow_dispatch: {}
  pull_request: {}
  push: { branches: [refactor/auth-ui-rebuild, main] }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-lighthouse-dummy-secret-32ch
      - run: bunx lhci autorun
        env:
          NODE_ENV: production
          SESSION_SECRET: ci-lighthouse-dummy-secret-32ch
          # required in production by env.server.ts (fails fast without it); dummy is fine — lhci never talks to Zitadel
          ZITADEL_API_URL: http://localhost:8080
